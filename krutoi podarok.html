<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения, Папа!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Контейнер для текста */
        .text-container {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 90%;
            width: 600px;
            z-index: 10;
            padding: 0 15px;
        }

        .fade-text {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            line-height: 1.6;
            font-weight: 500;
            color: #f0f6fc;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .fade-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Бьющееся сердце */
        .heart-container {
            font-size: clamp(3rem, 12vw, 4.2rem);
            margin-top: 25px;
            z-index: 10;
            user-select: none;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 1.5s ease, transform 1.5s ease;
            filter: drop-shadow(0 0 16px rgba(255, 77, 77, 0.5));
        }

        .heart-container.visible {
            opacity: 1;
            animation: heartbeat 1.2s infinite 1.5s;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(255, 77, 77, 0.5)); }
            15% { transform: scale(1.2); filter: drop-shadow(0 0 24px rgba(255, 77, 77, 0.8)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(255, 77, 77, 0.5)); }
            45% { transform: scale(1.12); filter: drop-shadow(0 0 20px rgba(255, 77, 77, 0.7)); }
            60% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(255, 77, 77, 0.5)); }
        }

        /* Фоновые плывущие надписи */
        .bg-text {
            position: absolute;
            color: rgba(255, 215, 0, 0.22);
            font-weight: 600;
            font-size: clamp(0.8rem, 3vw, 1rem);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            animation: floatUp 11s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 0.28; }
            85% { opacity: 0.28; }
            100% {
                transform: translateY(-15vh) rotate(10deg);
                opacity: 0;
            }
        }

        /* Вылетающие элементы из центра в финале */
        .burst-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-weight: 600;
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.4);
            transition: transform 3.2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 3.2s ease-out;
        }

        .burst-text.active {
            opacity: 0.9;
            transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot));
        }
    </style>
</head>
<body>

    <div class="text-container">
        <div id="text" class="fade-text"></div>
    </div>

    <!-- Бьющееся сердце -->
    <div id="heart" class="heart-container">❤️</div>

    <script>
        const messages = [
            "Пап, спасибо, что воспитал меня.",
            "Что дарил заботу и учил меня жить правильно.",
            "Спасибо большое тебе за всё!"
        ];

        const textElement = document.getElementById('text');
        const heartElement = document.getElementById('heart');

        let currentMsgIndex = 0;

        function showNextMessage() {
            if (currentMsgIndex < messages.length) {
                textElement.classList.remove('visible');

                setTimeout(() => {
                    textElement.innerText = messages[currentMsgIndex];
                    textElement.classList.add('visible');
                    currentMsgIndex++;

                    setTimeout(showNextMessage, 3500);
                }, 1200);
            } else {
                heartElement.classList.add('visible');
                // Запуск разлета надписей из центра через 2.5 секунды после появления сердца
                setTimeout(startExplosion, 2500);
            }
        }

        // Запуск показа фраз
        showNextMessage();

        const bgPhrases = [
            "С днём рождения!",
            "С днём рождения, Папа!",
            "С праздником!",
            "Здоровья и счастья!",
            "С днём рождения!"
        ];

        function createBgText() {
            if (currentMsgIndex > messages.length) return; // Останавливаем генерацию фона при начале финала

            const el = document.createElement('div');
            el.className = 'bg-text';
            el.innerText = bgPhrases[Math.floor(Math.random() * bgPhrases.length)];

            el.style.left = Math.random() * 85 + 'vw';
            el.style.animationDuration = (Math.random() * 4 + 8) + 's';

            document.body.appendChild(el);

            setTimeout(() => { el.remove(); }, 12000);
        }

        setInterval(createBgText, 500);

        const burstPhrases = [
            "С днём рождения!",
            "Папа, с праздником!",
            "Крепкого здоровья!",
            "Счастливого дня рождения!",
            "Лучшему папе!",
            "Всего самого наилучшего!",
            "Ура-ура-ура! 🎉",
            "С днём рождения! 🎂",
            "Спасибо за всё!",
            "Улыбок и радости!"
        ];

        const colors = [
            '#ff7675', '#74b9ff', '#ffeaa7', 
            '#55efc4', '#a29bfe', '#fd79a8', '#fdcb6e'
        ];

        function startExplosion() {
            const totalCount = 60;
            let delay = 0;

            for (let i = 0; i < totalCount; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'burst-text';
                    el.innerText = burstPhrases[Math.floor(Math.random() * burstPhrases.length)];

                    el.style.color = colors[Math.floor(Math.random() * colors.length)];

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 42 + 18;

                    const tx = Math.cos(angle) * distance + 'vw';
                    const ty = Math.sin(angle) * distance + 'vh';
                    const rot = (Math.random() * 30 - 15) + 'deg';

                    el.style.setProperty('--tx', tx);
                    el.style.setProperty('--ty', ty);
                    el.style.setProperty('--rot', rot);

                    document.body.appendChild(el);

                    requestAnimationFrame(() => {
                        el.classList.add('active');
                    });

                }, delay);

                delay += 120;
            }
        }
    </script>
</body>
</html>
